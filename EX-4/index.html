<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <img src="profilepic.jpg" alt="Profile Picture" class="profile-img">
        <h1 style="color: #2c3e50; font-family: sans-serif;">Sophat Chesda</h1>
        <h2 class="role">UI/UX Mobile Designer</h2>
        <div class="stats">
        <div class="stat-item">
            <span class="stat-title">Assignments</span>
            <span class="stat-value">12</span>
        </div>
        <div class="stat-item">
            <span class="stat-title">Courses</span>
            <span class="stat-value">4</span>
        </div>
        <div class="stat-item">
            <span class="stat-title">Classmates</span>
            <span class="stat-value">27</span>
        </div>
    </div>
        <p class="bio">
            I am a university student learning how to code. I enjoy building simple and nice web pages.
        </p>
        <button class="contact-btn">View Profile</button>
    </div>
</body>
</html>
